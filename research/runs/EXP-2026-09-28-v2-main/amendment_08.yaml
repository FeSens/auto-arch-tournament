# WRITE-ONCE. Amendment 08 to prereg.yaml, written 2026-09-29, after
# incident 06 and before the campaign restart; its commit time is the
# authoritative timestamp. No scored run exists.
reason: >
  Incident 06: the sixth campaign (harness 2.6.0, started 2026-09-29T03:49:37Z) was
  stopped at 05:32:22Z (~1.7 h, rounds 4-6) as a harness failure under the incident
  policy. From harness 2.5 rc2 on, the Claude agents' shell commands ran without Claude
  Code's sandbox: in smokes 12 and 13 and the 2.5 and 2.6 campaigns. Codex was not
  affected. 2.5 moved each agent's private TMPDIR under its worktree; Claude Code's
  sandbox binds its proxy's Unix sockets under TMPDIR, and a Unix socket path may not
  exceed 107 bytes. Measured on the run host (Claude Code 2.1.283), the sandbox starts
  with a TMPDIR of up to 74 characters and fails from 75 on; the worktree TMPDIRs had
  118. On that failure Claude Code by default warns ("Sandbox is enabled but failed to
  initialize ... Sandboxing is disabled for the rest of this session") and runs the
  session unconfined. All 102 archived hypothesis and implementation sessions show the
  message; the scribes (TMPDIR under the clone root, exactly 74 characters) stayed
  sandboxed. Unconfined commands ran as the run's agent account in the host's PID and
  mount namespaces, with network access. The account boundary held (no access to other
  runs' clones, the operator's files or other accounts' processes), but within a run an
  agent could see and signal its sibling slots' processes, and its account home links
  the pool's shared Codex login. Audit of the affected Opus transcripts (2,083 shell
  commands, every tool call): no network use, nothing read outside the run's clone and
  the agent's own CLI home; 22 process listings that also counted sibling slots'
  solvers (three showed sibling CLIs' command lines, which carry their prompts); two
  `pkill -f` whose patterns match any slot's formal run: Claude Code refused one, and
  the other (the monitor's HIGH alert at 05:29Z that led to the stop) hit only the
  agent's own runs, since by the transcripts' timestamps no sibling had one running.
  The failure message was in the transcripts from smoke12 on, and 13 agents said in
  their final message that they ran unsandboxed, but no monitor rule matched it, and
  the validations of amendments 06 and 07 checked outcomes, not that each sandbox
  started. Correction: amendment 06's validation reads smoke12's HIGH alert as "an
  agent's pkill inside its own sandboxed call"; that session was unsandboxed (Claude
  Code refused the pkill because the pattern matched its own CLI process), see
  monitor_review.md.
incident_06_runs: >
  Reported, not scored: research/runs/EXP-2026-09-28-v2-main/incident_06/ (agent and
  hypothesis-agent logs, the sessions still running at the stop, orchestrator logs,
  experiment logs, runner log and results dir, monitor alerts, the agent processes'
  namespaces at the stop). Per the incident policy all 18 runs restart from V0; the
  first complete attempt of each is scored.
harness: >
  tag hwe-bench-v2.7 = branch bench-v2.7, HARNESS_VERSION 2.7.0 (replaces
  hwe-bench-v2.6). Changes: (1) the Claude sandbox fails closed
  (sandbox.failIfUnavailable): a command that cannot be sandboxed fails instead of
  running unconfined. (2) Agents' private TMPDIRs go under a short per-run base outside
  the clone, /srv/hwebench/tmp/<8 hex>/<8 hex> (26 characters, the same for every run);
  the launcher refuses a TMPDIR over 48 characters. (3) Before its first round each
  Claude or Codex run starts one agent through the full launch path and has it report
  its PID and mount namespaces, whether it can reach the network and, for Claude,
  whether it can see the account's home; the run stops as a harness error unless the
  command ran in namespaces of its own with no network (tools/agents/sandbox_probe.py;
  the verdict is saved with the run). Host setup: research/v2/scripts/setup_server.sh,
  section 5 (the tmp base). No change to prompts, budgets, evals, scoring or
  acceptance. Same rules for every system.
monitoring: >
  Extends amendments 02, 05, 06 and 07: either CLI's sandbox-failure message in an
  agent transcript is HIGH, and so is an agent-account process in the host's PID
  namespace other than the agent CLIs, their sandbox launchers and bridges.
validation: >
  389 harness tests pass, and the 3 opt-in live tests pass on the run host. The TMPDIR
  limit was measured with the real sandbox as an agent account: lengths 60, 61 and 74
  start it; 75, 76, 77, 78, 82, 86, 90, 105 and 118 fail with the 2.5/2.6 message and
  run in the host's namespaces. Live sandbox probe through the full launch path: Claude
  and Codex both confined (own PID and mount namespaces, network blocked, Claude's
  account home hidden); with Claude's sandbox disabled the probe fails (host
  namespaces, network open, home visible). Replayed on incident 06's transcripts, the
  new monitor rule flags all 18 Opus hypothesis and 17 implementation transcripts, one
  scribe that grepped another agent's log, and no GPT transcript. Smoke14 on
  bench-v2.7-rc (rc1; 3 systems, N=2 K=3, 05:59Z to 06:54Z): all three runs done, 0
  broken slots, held-out scored (5 of 5 kernels validated in each), final RTL saved;
  all three probes confined; 0 sandbox-failure messages in the 57 agent sessions;
  sampled every 15 s over the whole run, 4,007 samples of agent commands, all in
  sandbox namespaces, and none of an agent command in the host's namespace (only the
  CLIs, bwrap launchers and Claude's socat bridges); 0 processes left in the accounts,
  the runs' temp bases removed; 0 journal entries with the Claude token (70 agent
  scopes). One HIGH alert, an Opus hypothesis agent's pkill of its own timing run,
  checked and benign (exit 143 on its own shell; no killed or failed command in the
  siblings' transcripts). The tag adds only the version file and research files to
  the smoke-tested code.
command: >
  python3 -m tools.bench.runner --models tools/bench/models-v2.yaml --ref bench-v2.7
  --agent-user hwebench,hwebench2,hwebench3 --reps 6 --interleave --n 15 --k 3
  --results-jsonl bench/v2/results.jsonl --results-dir bench/v2
unchanged: question, systems, metrics, tests, verdict rules, budget, runs per system, incident policy
launched: >
  2026-09-29T06:56:12Z, tmux main on hwe-bench, results in bench/v2/ (amendment commit
  f50ce01 at 06:55:55Z, before launch; this field was filled in afterwards, as its
  first version said it would be). All three batch-1 sandbox probes: confined.
