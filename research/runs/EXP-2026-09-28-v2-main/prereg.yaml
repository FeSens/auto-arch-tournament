# WRITE-ONCE. Pre-registered 2026-09-28T03:39Z, before any main run.
id: EXP-2026-09-28-v2-main
fixture: branch bench-v2.0 = tag hwe-bench-v2.0 = ba9b7e9d1c0da79d3313667990fbb67a46baf1a4 (never moved)
checks_before_freeze: >
  Gowin installed for the agent account; nextpnr not executable by it; make timing
  run by both CLIs as hwebench inside their sandboxes returns the Gowin report
  (5.14 MHz on V0, place_option 0); smoke test of both systems end to end
  (pre-Gowin harness); 362 harness tests pass on the run host.
command: >
  python3 -m tools.bench.runner --models tools/bench/models-v2.yaml --ref bench-v2.0
  --agent-user hwebench --reps 6 --interleave --n 15 --k 3
  --results-jsonl bench/v2/results.jsonl --results-dir bench/v2
question: >
  Under the HWE Bench V2 contract, does the final design produced by
  Claude Opus 5.5 (xhigh, Claude Code) score differently on the held-out
  suite than the final design produced by GPT-6 Sol (xhigh, Codex CLI)?
systems:
  - name: claude-opus-5_5_xhigh-v2
    cli: Claude Code 2.1.283 (pinned copy, /srv/hwebench/bin; recorded per row)
    model: claude-opus-5-5
    effort: xhigh
  - name: gpt-6-sol_xhigh-v2
    cli: Codex CLI 0.156.1 (pinned copy; recorded per row)
    model: gpt-6-sol
    effort: xhigh
unit_of_comparison: >
  A model inside its vendor's CLI. Claims name the system, never the bare model.
host: >
  hwe-bench (Hetzner EX63, 20 cores, Ubuntu 26.04). Runner as `bench`; agent CLIs
  as `hwebench`, which cannot read the runner's home (held-out kernels, results)
  or run nextpnr. Both CLIs get the same writable paths for their self-checks.
harness: >
  tag hwe-bench-v2.0, HARNESS_VERSION 2.0.0; toolchain_digest recorded per row.
  FPGA fitness: Gowin EDA 1.9.11.03 Education on GW2AR-LV18QN88C8/I7, V2 wrapper
  (memory ready signals from the same stall generator the simulator uses; RVFI
  not timed), Fmax = median over place_option 0/1/2; score = Fmax x CoreMark
  iterations per cycle under random memory stalls. No Yosys/nextpnr timing
  anywhere in the loop; Yosys runs only inside riscv-formal.
  Gates: lint, riscv-formal (nret=1), cosim on selftest + 3 random trace programs
  with and without stalls + CoreMark, FPGA fit.
  Acceptance: candidate must beat the champion by ACCEPT_MARGIN_LN = 0.045 (4.6%),
  set by EXP-2026-09-28-v2-gowin-calibration.
budget: N=15 rounds, K=3 slots, hypothesis 20 min, implementation 30 min, scribe 4 min, same for both
runs_per_system: 6
schedule: >
  runner --interleave: rep r of both systems starts together; rep r+1 starts when
  both finish; launch order alternates by rep. Provider quota pauses wait and
  rerun the interrupted attempt from scratch (tools/agents/quota.py) and are logged.
primary_metric: >
  ln(held-out score) of each run's final champion: its Gowin Fmax (re-measured by
  score_holdout; the flow is deterministic) times the geometric mean over the five
  held-out kernels of iterations per cycle (cycle-accurate simulation with stalls).
primary_test: >
  Welch two-sample t-test on ln(held-out score), two-sided, alpha = 0.05; report the
  ratio of geometric means with its 95% CI, plus a 10,000-sample percentile
  bootstrap CI as a robustness check.
power_note: >
  The run-to-run spread under the Gowin flow is unknown before the runs (V1's
  within-configuration SD, ~11% under nextpnr, does not transfer). With n=6 per
  system, a difference smaller than roughly the run-to-run SD will likely end as
  "not distinguishable". The observed SD is reported.
verdict_rules:
  - "95% CI of the ratio excludes 1 and p < 0.05: the system with the higher mean ranks higher on this contract."
  - "Otherwise: not distinguishable at n=6. No ranking claimed; no 'within noise' wording."
secondary_metrics: >
  CoreMark score (the optimization signal), accepted / correct-no-gain / failed
  attempts by stage, hypothesis timeouts, quota pauses, Gowin logic / registers /
  LUT-RAM / BSRAM / DSP of the final design, tokens, wall time. Descriptive only.
incident_policy: >
  A run stopped by a harness, host or provider failure (not by the agent) is re-run
  from V0 and both attempts are reported; the scored run is the first complete one.
  Runs are never discarded for being low.
